services:
  - type: web
    name: youtube-subscriber-counter
    runtime: node
    buildCommand: npm run install:all && npm run build
    startCommand: npm run start --prefix server
    envVars:
      - key: YOUTUBE_API_KEY
        sync: false
      - key: POLL_INTERVAL_MS
        value: "3000"
      - key: NODE_VERSION
        value: "20"
